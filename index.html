<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>QuickNotes</h1>
      <p class="intro">
        A small API client that loads, creates and deletes notes using
        JSONPlaceholder.
      </p>

      <section class="panel" aria-labelledby="load-heading">
        <h2 id="load-heading">Your notes</h2>
        <button id="load-btn" type="button">Load notes</button>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="form-heading">
        <h2 id="form-heading">New note</h2>
        <form id="note-form" novalidate>
          <div class="field">
            <label for="title-input"
              >Title (required, max 100 characters)</label
            >
            <input
              type="text"
              id="title-input"
              name="title"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="body-input">Body (optional)</label>
            <textarea id="body-input" name="body" rows="4"></textarea>
          </div>
          <button id="submit-btn" type="submit">Add note</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-heading">
        <h2 id="list-heading">Notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </main>
  </body>
</html>
